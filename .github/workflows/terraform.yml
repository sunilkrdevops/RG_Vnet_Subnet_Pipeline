name: Terraform

on:
  push:
    branches:
      - main
      - featurebranch
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Feature branches + Pull Requests
    if: github.ref != 'refs/heads/main'

    defaults:
      run:
        working-directory: ./parent_module

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Terraform Directory
        run: |
          pwd
          ls -la
          terraform version

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan


  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Apply ONLY after push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: ./parent_module

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Terraform Directory
        run: |
          pwd
          ls -la
          terraform version

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan# trigger
